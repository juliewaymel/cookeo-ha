<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recettes Cookeo</title>
<style>
  :root { --bx:#7c1c34; --rose:#be4e6e; --bg:#1b1b1f; --card:#26262c; --txt:#f3eef0; --muted:#b9a8ae; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Roboto,system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header { position:sticky; top:0; z-index:5; padding:14px 18px;
           background:linear-gradient(135deg,var(--bx),var(--rose)); box-shadow:0 2px 12px #0007; }
  header h1 { margin:0 0 8px; font-size:20px; display:flex; align-items:center; gap:8px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  #q { flex:1; min-width:200px; padding:10px 14px; border:none; border-radius:22px; font-size:15px;
       background:#fff; color:#222; outline:none; }
  .count { font-size:13px; color:#fff; opacity:.9; }
  .upd { font-size:11px; color:#fff; opacity:.75; margin-top:4px; }

  /* --- liste --- */
  #grid { padding:16px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .card { background:var(--card); border-radius:14px; overflow:hidden; cursor:pointer;
          transition:transform .12s, box-shadow .12s; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-3px); box-shadow:0 8px 22px #0008; }
  .card img { width:100%; height:140px; object-fit:cover; background:#333; }
  .card .body { padding:10px 12px; }
  .card .title { font-weight:600; font-size:14.5px; line-height:1.25; }
  .card .meta { margin-top:6px; font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .chip { background:#3a2a30; color:var(--rose); padding:1px 8px; border-radius:10px; font-weight:600; font-size:12px; }
  .empty { color:var(--muted); padding:40px; text-align:center; grid-column:1/-1; }

  /* --- fiche (page active) --- */
  #detail { max-width:760px; margin:0 auto; padding:0 0 40px; }
  #detail .hero { position:relative; }
  #detail .hero img { width:100%; max-height:340px; object-fit:cover; display:block; }
  #back { position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:8px;
          width:100%; border:none; cursor:pointer; padding:12px 18px; font-size:15px; font-weight:600;
          color:#fff; background:linear-gradient(135deg,var(--bx),var(--rose)); }
  #detail .pad { padding:18px; }
  #detail h2 { margin:6px 0 4px; font-size:24px; }
  #detail .dmeta { color:var(--muted); font-size:14px; margin-bottom:10px; display:flex; gap:14px; flex-wrap:wrap; }
  #detail h3 { color:var(--rose); font-size:17px; margin:22px 0 8px; }
  #detail ul.ing { margin:0; padding-left:20px; line-height:1.7; }
  #detail ol.steps { margin:0; padding-left:24px; }
  #detail ol.steps li { margin-bottom:14px; line-height:1.55; }
  #detail ol.steps li::marker { color:var(--rose); font-weight:700; }
  #detail .stepbadges { margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
  .fid { font-size:11px; color:var(--muted); margin-top:24px; }
</style>
</head>
<body>
<header>
  <h1>🍲 Recettes Cookeo</h1>
  <div class="bar">
    <input id="q" placeholder="Rechercher une recette ou un ingrédient…" autocomplete="off">
    <span class="count" id="count">…</span>
  </div>
  <div class="upd" id="upd"></div>
</header>

<main id="list"><div id="grid"><div class="empty">Chargement du catalogue…</div></div></main>

<section id="detail" hidden>
  <button id="back">← Retour aux recettes</button>
  <div class="hero"><img id="d-img" alt=""></div>
  <div class="pad">
    <h2 id="d-title"></h2>
    <div class="dmeta" id="d-meta"></div>
    <h3>🥕 Ingrédients</h3>
    <ul class="ing" id="d-ing"></ul>
    <h3 id="d-steps-h">👩‍🍳 Préparation</h3>
    <ol class="steps" id="d-steps"></ol>
    <div class="fid" id="d-fid"></div>
  </div>
</section>

<script>
let RECIPES = [];
const grid=document.getElementById('grid'), q=document.getElementById('q'),
      countEl=document.getElementById('count'),
      listView=document.getElementById('list'), detailView=document.getElementById('detail');

const PROG={'PROGRAM_200143':'Dorage doux','PROGRAM_200144':'Dorage moyen','PROGRAM_200063':'Dorage fort',
 'PROGRAM_200065':'Maintien chaud','PROGRAM_200068':'Pression ultra','PROGRAM_200067':'Cuisson pression',
 'PROGRAM_200066':'Pression douce','PROGRAM_200145':'Vapeur douce','PROGRAM_200146':'Vapeur forte',
 'PROGRAM_200064':'Mijotage doux','PROGRAM_200062':'Mijotage moyen','PROGRAM_200142':'Mijotage fort',
 'PROGRAM_200159':'Dorage','PROGRAM_200156':'Cuisson pression','PROGRAM_200157':'Pression douce',
 'PROGRAM_200158':'Cuisson lente','PROGRAM_200160':'Mijotage','PROGRAM_200161':'Maintien chaud','PROGRAM_REHEAT':'Réchauffage'};
const progName = k => PROG[k] || (k||'').replace('PROGRAM_','Prog ');
const esc = s => (s+'').replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function render(list){
  if(!list.length){ grid.innerHTML='<div class="empty">Aucune recette.</div>'; countEl.textContent='0'; return; }
  countEl.textContent = list.length+' recettes';
  grid.innerHTML='';
  for(const r of list){
    const c=document.createElement('div'); c.className='card';
    c.innerHTML = `<img loading="lazy" src="${r.image||''}" alt="" onerror="this.style.opacity=.25">
      <div class="body"><div class="title">${esc(r.title||'')}</div>
      <div class="meta">${r.total_min?`<span>⏱ ${r.total_min} min</span>`:''}
      ${r.ingredients&&r.ingredients.length?`<span>🥕 ${r.ingredients.length}</span>`:''}
      ${r.yield?`<span class="chip">${esc(r.yield)} pers</span>`:''}</div></div>`;
    c.addEventListener('click', ()=>showRecipe(r));
    grid.appendChild(c);
  }
}

function showRecipe(r){
  document.getElementById('d-img').src = r.image||'';
  document.getElementById('d-title').textContent = r.title||'';
  document.getElementById('d-meta').innerHTML =
    [r.total_min?`⏱ ${r.total_min} min`:'', r.yield?`👥 ${esc(r.yield)} pers`:''].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
  const ul=document.getElementById('d-ing'); ul.innerHTML='';
  (r.ingredients||[]).forEach(i=>{ const li=document.createElement('li'); li.textContent=i; ul.appendChild(li); });
  if(!(r.ingredients||[]).length) ul.innerHTML='<li style="color:var(--muted)">Non disponibles</li>';

  const steps=r.steps||[];
  document.getElementById('d-steps-h').style.display = steps.length ? '' : 'none';
  const ol=document.getElementById('d-steps'); ol.innerHTML='';
  steps.forEach(s=>{
    const li=document.createElement('li');
    let badges='';
    if(s.program) badges+=`<span class="chip">${progName(s.program)}</span>`;
    if(s.duration_s) badges+=`<span class="chip">⏱ ${Math.round(s.duration_s/60)} min</span>`;
    if(s.temp) badges+=`<span class="chip">${s.temp}°C</span>`;
    li.innerHTML = esc(s.desc||'').replace(/\n/g,'<br>') + (badges?`<div class="stepbadges">${badges}</div>`:'');
    ol.appendChild(li);
  });
  document.getElementById('d-fid').textContent = 'id Cookeo : '+(r.fid||'?');
  listView.hidden=true; detailView.hidden=false; window.scrollTo(0,0);
}

function back(){ detailView.hidden=true; listView.hidden=false; window.scrollTo(0,0); }
document.getElementById('back').addEventListener('click', back);

function filter(){
  const t=q.value.trim().toLowerCase();
  if(!t) return render(RECIPES);
  render(RECIPES.filter(r =>
    (r.title||'').toLowerCase().includes(t) ||
    (r.ingredients||[]).some(i=>i.toLowerCase().includes(t))));
}
q.addEventListener('input', filter);

fetch('catalog.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  RECIPES = d.recipes||[];
  if(d.updated_ts) document.getElementById('upd').textContent =
    'Catalogue : '+RECIPES.length+' recettes · MAJ '+new Date(d.updated_ts*1000).toLocaleString('fr-FR');
  render(RECIPES);
}).catch(e=>{ grid.innerHTML='<div class="empty">Catalogue indisponible.<br>'+e+'</div>'; });
</script>
</body>
</html>
